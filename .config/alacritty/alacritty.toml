[env]
TERM = "xterm-256color"

[window]
padding={x=4,y=4}
opacity=1
# opacity=0
# blur=true
decorations = "None"

[font]
size=9

[mouse]
hide_when_typing=true
#
# [colors]
# [colors.primary]
# background="#000000"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[general]
import = [
    "~/.config/alacritty/themes/themes/kanagawa_wave.toml"
]
